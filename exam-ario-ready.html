<!doctype html>
<html lang="fa" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex"><meta name="theme-color" content="#3D63F0"><title>آزمون Ario</title>
<style>
:root{color-scheme:light dark;--bg:#edf1fa;--card:#fff;--tx:#1b2440;--mu:#6b7794;--pr:#3D63F0;--ok:#1fae58;--bad:#e5322a;--ln:#d9e0f1}
@media(prefers-color-scheme:dark){:root{--bg:#0f1426;--card:#1a2140;--tx:#eef1fb;--mu:#9aa6c8;--ln:#2a3358}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.8 Vazirmatn,Tahoma,Arial,sans-serif;min-height:100vh}
.w{max-width:620px;margin:auto;padding:16px 15px 40px}.card{background:var(--card);border-radius:20px;padding:20px;box-shadow:0 6px 24px #283c7818;margin-bottom:14px}
h1{font-size:1.3rem;margin:0 0 7px}h2{font-size:1.05rem;margin:0 0 12px}p,small{color:var(--mu);margin:.2em 0}
input{width:100%;font:inherit;color:inherit;background:transparent;border:1.5px solid var(--ln);border-radius:14px;padding:12px 14px;margin:6px 0;outline:none}
input:focus{border-color:var(--pr)}.btn{display:block;width:100%;font:inherit;font-weight:700;color:white;background:var(--pr);border:0;border-radius:14px;padding:13px;margin-top:10px;cursor:pointer}
.btn:disabled{opacity:.45}.btn.g{background:transparent;color:var(--pr);border:1.5px solid var(--pr)}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 10px}.tm{display:flex;align-items:center;justify-content:space-between;gap:10px}
.clock{font-weight:800;font-size:1.55rem;font-variant-numeric:tabular-nums;direction:ltr;color:var(--pr)}.clock.lo{color:var(--bad)}
.bar{height:6px;border-radius:6px;background:var(--ln);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--pr);transition:width .9s linear}
.o{display:flex;gap:10px;align-items:center;width:100%;text-align:right;font:inherit;color:inherit;background:transparent;border:1.5px solid var(--ln);border-radius:14px;padding:12px 14px;margin:8px 0;cursor:pointer}
.o b{display:inline-grid;place-items:center;min-width:30px;height:30px;border-radius:50%;background:var(--ln)}.o.on{border-color:var(--pr);background:#3d63f01a}.o.on b{background:var(--pr);color:white}
.nav{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.nav button{width:38px;height:38px;border-radius:10px;border:1.5px solid var(--ln);background:transparent;color:inherit;font:inherit;cursor:pointer}
.nav .d{background:#3d63f026;border-color:var(--pr)}.nav .c{outline:2px solid var(--pr)}
.row{display:flex;gap:10px}.row .btn{margin-top:10px;flex:1}.big{font-size:2.4rem;font-weight:800;text-align:center;color:var(--pr)}
.rs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;margin:10px 0}.rs div{background:var(--bg);border-radius:12px;padding:8px}.rs b{display:block;font-size:1.3rem}
.qtext{font-size:1.08rem;font-weight:700;margin:10px 0 16px;white-space:pre-wrap}.brand{text-align:center;color:var(--pr);font-weight:900;margin:8px 0 16px}
</style></head><body><div class="w" id="app"><div class="card"><div class="brand">Ario</div><p style="text-align:center">در حال دریافت آزمون…</p></div></div>
<script>
(function(){
'use strict';
var URL_BASE='https://uwmuqemzyvwykuetkucl.supabase.co';
var KEY='sb_publishable_YWxdfVFXeDiEhaCFofQ7lw_BiNQNWD2';
var app=document.getElementById('app'),EX=null,ST=null,tick=null,cur=0,sending=false,FA='۰۱۲۳۴۵۶۷۸۹';
function fa(n){return String(n).replace(/\d/g,d=>FA[+d])}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function mmss(s){s=Math.max(0,Math.floor(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function show(t,m,extra){app.innerHTML='<div class="card"><div class="brand">Ario</div><h1>'+esc(t)+'</h1><p>'+esc(m)+'</p>'+(extra||'')+'</div>'}
function rpc(name,data){return fetch(URL_BASE+'/rest/v1/rpc/'+name,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify(data)}).then(async r=>{let t=await r.text(),j;try{j=t?JSON.parse(t):null}catch(e){j={message:t}}if(!r.ok)throw Error(j?.message||j?.details||j?.error||('خطای سرور '+r.status));return j})}
function getCode(){try{return decodeURIComponent(location.hash.slice(1)).split('&')[0].trim()}catch(e){return location.hash.slice(1).trim()}}
function pick(o,keys,d){for(let k of keys)if(o&&o[k]!=null)return o[k];return d}
function normalize(raw){
 if(Array.isArray(raw))raw=raw[0];if(!raw||typeof raw!=='object')throw Error('اطلاعات آزمون قابل خواندن نیست.');
 if(raw.ok===false||raw.success===false)throw Error(raw.message||raw.error||'آزمون در دسترس نیست.');
 let ex=raw.exam||raw.data||raw,qs=pick(raw,['questions','items'],pick(ex,['questions','items'],[]));
 if(typeof qs==='string'){try{qs=JSON.parse(qs)}catch(e){qs=[]}}
 if(!Array.isArray(qs)||!qs.length)throw Error('برای این آزمون سؤالی ثبت نشده است.');
 let questions=qs.map((q,i)=>{
  let text=pick(q,['question_text','question','text','content','title','body'],'');
  let opts=pick(q,['options','choices','answers'],null);
  if(typeof opts==='string'){try{opts=JSON.parse(opts)}catch(e){opts=opts.split(/\r?\n/)}}
  if(!Array.isArray(opts))opts=[pick(q,['option_a','option1','choice_a','a'],''),pick(q,['option_b','option2','choice_b','b'],''),pick(q,['option_c','option3','choice_c','c'],''),pick(q,['option_d','option4','choice_d','d'],'')];
  opts=opts.slice(0,4).map(o=>typeof o==='object'&&o!==null?String(pick(o,['text','label','value','title'],'')):String(o??''));
  if(!text||opts.length!==4||opts.some(x=>!x.trim()))throw Error('ساختار سؤال شماره '+(i+1)+' کامل نیست؛ سازنده آزمون باید بررسی کند.');
  return {text:String(text),options:opts};
 });
 let per=Number(pick(ex,['seconds_per_question','secondsPerQuestion','per_question_seconds'],60));if(!Number.isFinite(per)||per<5)per=60;
 let expiry=pick(ex,['expires_at','expiry_at','expiresAt'],null);if(expiry&&Date.parse(expiry)<Date.now())throw Error('مهلت شرکت در این آزمون به پایان رسیده است.');
 return {id:String(pick(ex,['public_code','code'],getCode())),title:String(pick(ex,['title','name'],pick(raw,['title'],'آزمون Ario'))),description:String(pick(ex,['description','details'],pick(raw,['description'],''))||''),per:Math.min(600,per),questions};
}
function sk(){return 'ario-exam-'+EX.id}function saved(){try{return JSON.parse(localStorage.getItem(sk())||'null')}catch(e){return null}}
function keep(x){try{localStorage.setItem(sk(),JSON.stringify(x))}catch(e){}}
function gate(){
 let n=EX.questions.length,tot=n*EX.per,r=saved();if(r&&r.done){if(r.sent)result(r);else retrySaved(r);return}
 app.innerHTML='<div class="card"><div class="brand">Ario</div><h1>'+esc(EX.title)+'</h1>'+(EX.description?'<p>'+esc(EX.description)+'</p>':'')+'<p>'+fa(n)+' پرسش چهارگزینه‌ای · '+fa(Math.ceil(tot/60))+' دقیقه زمان کل</p></div><div class="card"><h2>مشخصات دانش‌آموز</h2><input id="fn" placeholder="نام" maxlength="30"><input id="ln" placeholder="نام خانوادگی" maxlength="40"><p>پس از شروع، زمان آزمون محاسبه می‌شود. اگر صفحه بسته شد، از همین دستگاه می‌توانی ادامه بدهی.</p><button class="btn" id="go" disabled>شروع آزمون</button></div>';
 let fn=document.getElementById('fn'),ln=document.getElementById('ln'),go=document.getElementById('go');function check(){go.disabled=!(fn.value.trim().length>=2&&ln.value.trim().length>=2)}fn.oninput=ln.oninput=check;
 go.onclick=()=>{let s={name:fn.value.trim(),fam:ln.value.trim(),t0:Date.now(),a:[],done:false};keep(s);run(s)};
}
function run(s){
 ST=s;cur=0;let n=EX.questions.length,total=n*EX.per*1000;while(ST.a.length<n)ST.a.push(-1);
 app.innerHTML='<div class="top"><div class="tm"><small>'+esc(ST.name+' '+ST.fam)+'</small><span class="clock" id="ck"></span></div><div class="bar"><i id="br"></i></div></div><div id="q"></div>';
 function paint(){let left=Math.max(0,Math.ceil((ST.t0+total-Date.now())/1000)),ck=document.getElementById('ck');if(!ck)return;ck.textContent=mmss(left);ck.className='clock'+(left<=60?' lo':'');document.getElementById('br').style.width=(left/(total/1000)*100)+'%';if(left<=0)finish()}
 clearInterval(tick);tick=setInterval(paint,1000);paint();question();
}
function question(){
 let n=EX.questions.length,a=ST.a,q=EX.questions[cur],h='<div class="card"><small>پرسش '+fa(cur+1)+' از '+fa(n)+'</small><div class="qtext">'+esc(q.text)+'</div>';
 for(let k=0;k<4;k++)h+='<button class="o'+(a[cur]===k?' on':'')+'" data-k="'+k+'"><b>'+fa(k+1)+'</b><span>'+esc(q.options[k])+'</span></button>';
 h+='<div class="row"><button class="btn g" id="pv"'+(!cur?' disabled':'')+'>قبلی</button>'+(cur<n-1?'<button class="btn" id="nx">بعدی</button>':'<button class="btn" id="fin">پایان و ثبت آزمون</button>')+'</div></div><div class="card"><small>شماره پرسش‌ها · آبی یعنی پاسخ داده‌شده</small><div class="nav">';
 for(let i=0;i<n;i++)h+='<button data-i="'+i+'" class="'+(a[i]>=0?'d ':'')+(i===cur?'c':'')+'">'+fa(i+1)+'</button>';
 document.getElementById('q').innerHTML=h+'</div></div>';let el=document.getElementById('q');
 el.querySelectorAll('.o').forEach(b=>b.onclick=()=>{let k=+b.dataset.k;a[cur]=a[cur]===k?-1:k;keep(ST);question()});
 el.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{cur=+b.dataset.i;question();scrollTo(0,0)});
 let pv=document.getElementById('pv'),nx=document.getElementById('nx'),fin=document.getElementById('fin');
 if(pv)pv.onclick=()=>{cur--;question()};if(nx)nx.onclick=()=>{cur++;question();scrollTo(0,0)};
 if(fin)fin.onclick=()=>{let u=a.filter(x=>x<0).length;if(!u||confirm(fa(u)+' پرسش بی‌پاسخ مانده. آزمون ثبت شود؟'))finish()};
}
function finish(){if(sending||!ST||ST.done)return;clearInterval(tick);ST.done=true;ST.used=Math.min(EX.questions.length*EX.per,Math.round((Date.now()-ST.t0)/1000));keep(ST);retrySaved(ST)}
function retrySaved(r){ST=r;show('در حال ثبت آزمون…','پاسخ‌ها در حال ارسال به سامانه هستند.');submit()}
function submit(){
 if(sending)return;sending=true;let ans=ST.a.map(x=>x<0?'x':String(x)).join(''),controller=window.AbortController?new AbortController():null,timeout=setTimeout(()=>controller&&controller.abort(),18000);
 fetch(URL_BASE+'/rest/v1/rpc/exam_submit',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},signal:controller?controller.signal:undefined,body:JSON.stringify({p_id:EX.id,p_nm:ST.name,p_fam:ST.fam,p_ans:ans,p_used:ST.used})})
 .then(async r=>{let t=await r.text(),j;try{j=t?JSON.parse(t):null}catch(e){j={message:t}}if(!r.ok)throw Error(j?.message||j?.details||j?.error||'خطا در ثبت پاسخ‌ها');return j})
 .then(j=>{clearTimeout(timeout);sending=false;if(Array.isArray(j))j=j[0];if(j&&j.ok){ST.sent=true;ST.c=Number(j.c||0);ST.w=Number(j.w||0);ST.b=Number(j.b||0);ST.used=Number(j.used||ST.used);keep(ST);result(ST)}else{ST.err=j?.err||'ثبت پاسخ‌ها از طرف سرور تأیید نشد.';keep(ST);retryError(ST)}})
 .catch(e=>{clearTimeout(timeout);sending=false;ST.err=e.message||'ارتباط با سرور برقرار نشد.';keep(ST);retryError(ST)});
}
function retryError(r){show('ثبت آزمون انجام نشد',r.err||'اتصال اینترنت را بررسی کن. پاسخ‌ها روی همین دستگاه باقی مانده‌اند.','<button class="btn" id="rt">تلاش دوباره</button>');document.getElementById('rt').onclick=()=>retrySaved(r)}
function result(r){
 let n=EX.questions.length,pct=Math.round((r.c||0)/n*100),neg=Math.round((((r.c||0)*3-(r.w||0))/(n*3))*1000)/10;
 app.innerHTML='<div class="card"><div class="brand">Ario</div><h1>آزمون با موفقیت ثبت شد ✓</h1><p>'+esc(r.name+' '+r.fam)+'</p><div class="big">'+fa(pct)+'٪</div><div class="rs"><div><b style="color:var(--ok)">'+fa(r.c||0)+'</b>صحیح</div><div><b style="color:var(--bad)">'+fa(r.w||0)+'</b>غلط</div><div><b>'+fa(r.b||0)+'</b>نزده</div></div><p>درصد با نمره منفی: '+fa(neg)+'٪</p><p>زمان صرف‌شده: '+fa(mmss(r.used||0))+'</p></div><div class="card"><h2>نتیجه برای مشاورت ارسال شد</h2><p>می‌توانی این صفحه را ببندی.</p></div>';
}
let code=getCode();if(!code)show('لینک آزمون ناقص است','لینک کامل را از سازنده آزمون دریافت کن.');
else rpc('ario_get_public_exam',{p_code:code}).then(raw=>{EX=normalize(raw);gate()}).catch(e=>show('دریافت آزمون ناموفق بود',e.message||'لینک نامعتبر است یا سرور پاسخ نمی‌دهد.'));
})();
</script></body></html>
